# She's the Goose — Netlify configuration
[build]
  # Static site: nothing to build. The generated pages live in /site.
  publish = "site"

# 404.html in the publish directory is served automatically for missing pages.

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
